[project]
name = "offer-copilot"
version = "3.0.0"
description = "AI 求职全流程教练 — 从 JD 拆解到 Offer 选择的闭环（校招/社招/实习/转行，全职能）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
]
optional-dependencies = { web = ["fastapi", "uvicorn", "python-multipart"], export = ["reportlab", "python-docx"], llm = ["anthropic"] }

[project.scripts]
oc = "main:main"
oc-web = "main:run_web"
oc-cli = "main:run_cli"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["utils", "main"]
packages = ["modules", "components"]
